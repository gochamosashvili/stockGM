name: SEC fundamentals

on:
  schedule:
    - cron: '30 2 * * *'    # 06:30 Tbilisi
    - cron: '30 14 * * *'   # 18:30 Tbilisi
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download from SEC
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
        run: node scripts/sec-fundamentals.mjs
      - name: Save if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fundamentals.json
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "SEC fundamentals $(date -u +%Y-%m-%dT%H:%MZ)" && git push; fi
